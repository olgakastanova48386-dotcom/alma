name: Fill ALMA place photos
on:
  push:
    paths:
      - "scripts/fill-place-photos.mjs"
      - ".github/workflows/fill-place-photos.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fill-place-photos.mjs
      - name: Commit place photos
        run: |
          git config user.name "alma-photos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/places.ts public/place-images
          git diff --cached --quiet || git commit -m "Replace generic place photos with real photos"
          git pull --rebase origin main\n          git push
