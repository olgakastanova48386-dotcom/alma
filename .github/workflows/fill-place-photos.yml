name: Fill ALMA place photos
on:
  push:
    paths:
      - "scripts/fill-place-photos.mjs"
      - ".github/workflows/fill-place-photos.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fill-place-photos.mjs
      - run: ALMA_DATA_PATH=data/mapPlaces.ts node scripts/fill-place-photos.mjs
      - run: ALMA_DATA_PATH=data/coffeePlaces.ts node scripts/fill-place-photos.mjs
      - name: Commit place photos
        run: |
          git config user.name "alma-photos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/places.ts data/mapPlaces.ts data/coffeePlaces.ts public/place-images
          if git diff --cached --quiet; then
            echo "No photo changes"
            exit 0
          fi
          git commit -m "Replace generic place photos with real photos"
          git pull --rebase origin main
          git push
