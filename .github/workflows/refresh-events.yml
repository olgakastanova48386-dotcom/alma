name: Refresh ALMA events

on:
  push:
    paths:
      - "scripts/refresh-events.mjs"
      - ".github/workflows/refresh-events.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/refresh-events.mjs
      - name: Commit refreshed event photos
        run: |
          git config user.name "alma-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/events public/data/events-refresh.json
          if git diff --cached --quiet; then
            echo "No event media changes"
            exit 0
          fi
          git commit -m "Refresh current ALMA event media"
          git pull --rebase origin main
          git push
