name: Deploy ALMA to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep this workflow active: pushes to main publish the current ALMA production build.

# Automatic production deployment for ALMA — keep every main deployment queued

concurrency:
  group: alma-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare
        run: npm run build:vinext

      - name: Deploy to Cloudflare Workers
        run: npm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
